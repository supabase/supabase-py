  client.authentication_integration.third_party_auth: not_implemented
  client.authentication_integration.cross_client_token_sync:
    status: partially_implemented
    note: "On SIGNED_IN, TOKEN_REFRESHED, and SIGNED_OUT events the Authorization header used by postgrest, storage and functions is updated and realtime picks up the new token through its token callback. This works for the sync Client; AsyncClient.auth builds a new auth client on every access, so the listener registered at construction never receives events."
