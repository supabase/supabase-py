    status: implemented
    note: "The session is kept in memory unless a storage is given, with session_storage on AuthClientOptions or storage on the auth client constructors. There is no persist_session flag, since leaving the storage out already keeps the session in memory. storage_key on AuthClientOptions and the auth client constructors keeps clients that share a storage apart."
    symbols:
