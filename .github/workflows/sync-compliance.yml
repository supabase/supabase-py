name: Sync SDK Compliance Matrix

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: supabase/sdk/.github/workflows/sync-sdk-compliance.yml@9fa01486d9d7b03732bceb7c72d39ea735d134c4 # capability-matrix/v2.4.0
    secrets:
      client-id: ${{ secrets.GH_APP_ID }}
      private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
