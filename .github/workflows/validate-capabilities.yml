name: Validate SDK Compliance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: supabase/sdk/.github/workflows/validate-sdk-compliance-python.yml@b0eececd661e56913d95a442e6ae65d6584991eb # capability-matrix/v1.17.0
    with:
      griffe-packages: >-
        supabase supabase_auth postgrest storage3 realtime supabase_functions
      griffe-search-paths: >-
        src/supabase/src,src/auth/src,src/postgrest/src,src/storage/src,src/realtime/src,src/functions/src
