name: Validate SDK Compliance

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: supabase/sdk/.github/workflows/validate-sdk-compliance-python.yml@6f0d68ef8e06d297ba3bd3f0b41feaa80a7c64e0 # capability-matrix/v1.16.0
    with:
      griffe-packages: >-
        supabase supabase_auth postgrest storage3 realtime supabase_functions
      griffe-search-paths: >-
        src/supabase/src,src/auth/src,src/postgrest/src,src/storage/src,src/realtime/src,src/functions/src
