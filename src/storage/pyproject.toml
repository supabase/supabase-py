[project]
name = "storage3"
description = "Supabase Storage client for Python."
authors = [
  { name = "Joel Lee" , email="joel@joellee.org"},
  { name = "Leon Fedden" , email="leonfedden@gmail.com"},
  { name = "Daniel Reinón García" , email="danielreinon@outlook.com"},
  { name = "Leynier Gutiérrez González" , email="leynier41@gmail.com"},
  { name = "Anand Krishna" , email="anand2312@proton.me"},
]
maintainers = [
  { name = "Leonardo Santiago", email = "leonardo.santiago@supabase.io" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
]
license = "MIT"
readme = "README.md"
version = "3.0.0-a1" # {x-release-please-version}
requires-python = ">=3.11"

dependencies = [
  "pydantic >=2.11.7",
  "yarl>=1.20.1",
  "supabase_utils==3.0.0-a1", # x-release-please-version
  "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
iceberg = [
  "pyiceberg>=0.10.0",
]

[project.urls]
documentation = "https://supabase.github.io/storage-py"
homepage = "https://supabase.github.io/storage-py"
repository = "https://github.com/supabase/supabase-py"
changelog = "https://github.com/supabase/supabase-py/tree/main/CHANGELOG.md"

[dependency-groups]
lints = [
  "ruff >=0.12.1",
  "unasync >= 0.6.0",
  "python-lsp-server (>=1.12.2,<2.0.0)",
  "pyrefly >=1.4.0,<2.0.0",
  "python-lsp-ruff (>=2.2.2,<3.0.0)",
]
typecheck = [
  "pyiceberg>=0.10.0",
]
docs = [
  "Sphinx >=7.1.2",
  "sphinx-press-theme >=0.9.1",
  "sphinx-toolbox >=3.4.0",
]
tests = [
  "pytest >=9.0.3",
  "pytest-asyncio >=1.3.0",
  "pytest-cov >=6.2.1",
  "python-dotenv >=1.2.2",
  "supabase_utils[all]",
]
dev = [
  { include-group = "lints" },
  { include-group = "tests" },
  { include-group = "docs" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "tests"
filterwarnings = [
    "ignore::DeprecationWarning", # ignore deprecation warnings globally
]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  # "B",
  # flake8-simplify
  # "SIM",
  # isort
  "I",
]
ignore = ["E712", "E501", "E402"]

[tool.uv]
default-groups = [ "dev" ]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
extends = "../../pyrefly.toml"
project-includes = ["src", "tests"]
search-path = ["src", "."]
