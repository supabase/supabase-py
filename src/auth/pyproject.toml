[project]
name = "supabase_auth"
version = "3.0.0a1" # {x-release-please-version}
description = "Python Client Library for Supabase Auth"
authors = [
  {name = "Joel Lee", email = "joel@joellee.org" }
]
maintainers = [
  { name = "Leonardo Santiago", email = "leonardo.santiago@supabase.io" }
]
readme = "README.md"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
  "pydantic >=2,<3",
  "pyjwt[crypto] >=2.12.0",
  "typing-extensions >=4.15.0",
  "supabase_utils == 3.0.0a1", # x-release-please-version
]

[project.urls]
homepage = "https://github.com/supabase/supabase-py/tree/main/src/auth"
repository = "https://github.com/supabase/supabase-py"
documentation = "https://github.com/supabase/supabase-py/tree/main/src/auth"
changelog = "https://github.com/supabase/supabase-py/tree/main/CHANGELOG.md"

# [project.scripts]
# gh-download = "scripts.gh-download:main"

[dependency-groups]
tests = [
  "Faker >= 37.4.0",
  "respx >=0.20.2,<0.23.0",
  "pytest >=9.0.3",
  "pytest-mock >= 3.14.0",
  "pytest-cov >=6.2.1",
  "pytest-depends >= 1.0.1",
  "pytest-asyncio >=1.3.0",
  "supabase_utils[all]",
  "pyotp>=2.9.0",
]
lints = [
  "ruff >=0.12.1",
  "unasync >= 0.6.0",
  "python-lsp-server (>=1.12.2,<2.0.0)",
  "pyrefly >=1.4.0,<2.0.0",
  "python-lsp-ruff (>=2.2.2,<3.0.0)",
]
dev = [{ include-group = "lints" }, {include-group = "tests" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "tests"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  # "B",
  # flake8-simplify
  # "SIM",
  # isort
  "I",
]
ignore = ["E712", "E501", "E402", "UP006", "UP035"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
extends = "../../pyrefly.toml"
project-includes = ["src", "tests"]
search-path = ["src", "."]
