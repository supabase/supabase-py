[project]
name = "supabase_utils"
version = "3.0.0-a1" # {x-release-please-version}
authors = [
  { name = "Leonardo Santiago", email="leonardo.santiago@supabase.io" }
]
maintainers = [
  { name = "Leonardo Santiago", email = "leonardo.santiago@supabase.io" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11"
description = "Common collection of methods used in the supabase python libraries."
readme = "README.md"
dependencies = [
    "pydantic>=2.12.2",
    "pyrsistent>=0.20.0",
    "typing-extensions>=4.15.0",
    "yarl>=1.22.0",
]

[project.optional-dependencies]
httpx = ["httpx[http2] >=0.28,<0.29"]
aiohttp = ["aiohttp>=3.14.4"]
all = [
    "supabase_utils[httpx]",
    "supabase_utils[aiohttp]"
]

[project.urls]
homepage = "https://github.com/supabase/supabase-py"
repository = "https://github.com/supabase/supabase-py"
documentation = "https://github.com/supabase/supabase-py/tree/main/src/utils"
changelog = "https://github.com/supabase/supabase-py/tree/main/CHANGELOG.md"

[dependency-groups]
tests = [
    "pytest >=9.0.3",
    "pytest-cov >=6.2.1",
    "pytest-asyncio >=1.3.0",
]
lints = [
    "pyrefly >=1.4.0,<2.0.0",
]
dev = [{ include-group = "lints" }, { include-group = "tests" }, "supabase_utils[all]"]

[tool.uv]
default-groups = [ "dev" ]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "tests"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
extends = "../../pyrefly.toml"
project-includes = ["src", "tests"]
search-path = ["src", "."]
