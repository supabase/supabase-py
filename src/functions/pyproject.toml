[project]
name = "supabase_functions"
version = "3.0.0a1" # {x-release-please-version}
description = "Library for Supabase Functions"
authors = [
  { name = "Joel Lee", email = "joel@joellee.org" },
  { name = "Andrew Smith", email = "a.smith@silentworks.co.uk" },
]
maintainers = [
  { name = "Leonardo Santiago", email = "leonardo.santiago@supabase.io" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12.2",
  "supabase-utils==3.0.0a1", # x-release-please-version
  "yarl>=1.20.1",
]

[project.urls]
repository = "https://github.com/supabase/supabase-py"
homepage = "https://github.com/supabase/supabase-py/tree/main/src/functions"
changelog = "https://github.com/supabase/supabase-py/tree/main/CHANGELOG.md"

[dependency-groups]
tests = [
  "pyjwt>=2.15.1",
  "pytest >=9.0.3",
  "pytest-cov >=6.2.1",
  "pytest-asyncio >=1.3.0",
  "supabase_utils[all] == 3.0.0a1",
]
lints = [
  "ruff >=0.12.1",
  "python-lsp-server (>=1.12.2,<2.0.0)",
  "pyrefly >=1.4.0,<2.0.0",
  "python-lsp-ruff (>=2.2.2,<3.0.0)",
]
dev = [{ include-group = "lints" }, {include-group = "tests" }]

[tool.uv]
default-groups = [ "dev" ]

[tool.uv.sources]
supabase-utils = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "tests"
filterwarnings = [
    "ignore::DeprecationWarning", # ignore deprecation warnings globally
]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  # "B",
  # flake8-simplify
  # "SIM",
  # isort
  "I",
]
ignore = ["E712", "E501", "E402", "UP006", "UP035"]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.pyrefly]
extends = "../../pyrefly.toml"
project-includes = ["src", "tests"]
search-path = ["src", "."]
