[project]
name = "realtime"
version = "3.0.0a1" # {x-release-please-version}
description = "Supabase Realtime client for Python."
authors = [
    { name = "Joel Lee", email="joel@joellee.org"},
    { name = "Andrew Smith", email="a.smith@silentworks.co.uk"},
]
maintainers = [
  { name = "Leonardo Santiago", email = "leonardo.santiago@supabase.io" }
]
license = "MIT"
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
  "supabase_utils==3.0.0a1", # x-release-please-version
  "websockets >=14,<18",
  "typing-extensions >=4.14.0",
  "pydantic (>=2.11.7,<3.0.0)",
  "yarl>=1.22.0",
]

[project.urls]
homepage = "https://github.com/supabase/supabase-py/tree/main/src/realtime"
repository = "https://github.com/supabase/supabase-py"
documentation = "https://github.com/supabase/supabase-py/tree/main/src/realtime"
changelog = "https://github.com/supabase/supabase-py/tree/main/CHANGELOG.md"

[dependency-groups]
tests = [
  "aiohttp>=3.14.4",
  "pytest >=9.0.3",
  "pytest-cov >=6.2.1",
  "python-dotenv >=1.2.2",
  "pytest-asyncio >=1.3.0",
  "pudb>=2025.1.5",
]
lints = [
  "ruff >= 0.12.1",
  "python-lsp-server (>=1.12.2,<2.0.0)",
  "pyrefly >=1.4.0,<2.0.0",
  "python-lsp-ruff (>=2.2.2,<3.0.0)",
]
dev = [{ include-group = "lints" }, {include-group = "tests" }]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  # "B",
  # flake8-simplify
  # "SIM",
  # isort
  "I",
]
ignore = ["E712", "E501", "E402"]
# isort.required-imports = ["from __future__ import annotations"]


[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyrefly]
extends = "../../pyrefly.toml"
project-includes = ["src", "tests"]
search-path = ["src", "."]
