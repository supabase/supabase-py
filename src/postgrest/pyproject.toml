[project]
name = "postgrest"
version = "3.0.0-a2" # {x-release-please-version}
description = "PostgREST client for Python. This library provides an ORM interface to PostgREST."
authors = [
  { name = "Lương Quang Mạnh", email = "luongquangmanh85@gmail.com"},
  { name = "Joel Lee", email = "joel@joellee.org"},
  { name = "Anand"},
  { name = "Oliver Rice"},
  { name = "Andrew Smith", email = "a.smith@silentworks.co.uk"},
]
maintainers = [
  { name = "Leonardo Santiago", email = "leonardo.santiago@supabase.io" }
]
readme = "README.md"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
  "pydantic >=2,<3",
  "yarl>=1.20.1",
  "supabase_utils==3.0.0-a2", # x-release-please-version
  "typing-extensions>=4.12.0",
]

[project.urls]
homepage = "https://github.com/supabase/supabase-py/tree/main/src/postgrest"
repository = "https://github.com/supabase/supabase-py"
documentation = "https://supabase.com/docs/reference/python/select"
changelog = "https://github.com/supabase/supabase-py/tree/main/CHANGELOG.md"

[dependency-groups]
test = [
  "pytest >=9.0.3",
  "pytest-cov >=6.2.1",
  "pytest-depends >=1.0.1",
  "pytest-asyncio >=1.3.0",
  "unasync >= 0.6.0",
  "supabase_utils[all] == 3.0.0-a2", # x-release-please-version
]
lints = [
  "ruff >=0.12.1",
  "python-lsp-server (>=1.12.2,<2.0.0)",
  "pyrefly >=1.4.0,<2.0.0",
  "mypy >=2.4.1",
  "pyright >=1.1.414",
  "python-lsp-ruff (>=2.2.2,<3.0.0)",
]
dev = [ { include-group = "lints" }, { include-group="test" }]

[tool.uv]
default-groups = [ "dev" ]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning", # ignore deprecation warnings globally
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyrefly]
extends = "../../pyrefly.toml"
project-includes = ["src", "tests"]
search-path = ["src", "."]
