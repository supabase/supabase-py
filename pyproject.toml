[tool.uv.workspace]
members = [
  "src/realtime",
  "src/functions",
  "src/supabase",
  "src/storage",
  "src/postgrest",
  "src/auth",
  "src/utils",
]

[tool.uv.sources]
realtime = { workspace = true }
supabase_functions  = { workspace = true }
supabase_auth = { workspace = true }
supabase_utils = { workspace = true }
storage3 = { workspace = true }
postgrest = { workspace = true }
supabase = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # isort
  "I",
  # missing return type annotations
  "ANN2",
  # pylint errors and warnings
  "PLE",
  "PLW",
  # flake8-pie
  "PIE",
  # flake8-logging
  "LOG",
  # flynt
  "FLY",
  # flake8-2020
  "YTT",
  # flake8-async
  "ASYNC",
  # flake8-comprehensions
  "C4",
  # flake8-raise
  "RSE",
  # flake8-simplify
  "SIM",
  # flake8-return
  "RET",
  # flake8-pyi
  "PYI",
  # flake8-pytest-style
  "PT",
  # flake8-type-checking
  "TC",
  # Perflint
  "PERF",
  # Ruff-specific rules
  "RUF",
]
ignore = ["E501", "E402"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
