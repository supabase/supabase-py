[tool.uv.workspace]
members = [
  "src/realtime",
  "src/functions",
  "src/supabase",
  "src/storage",
  "src/postgrest",
  "src/auth",
  "src/utils",
]

[tool.uv.sources]
realtime = { workspace = true }
supabase_functions  = { workspace = true }
supabase_auth = { workspace = true }
supabase_utils = { workspace = true }
storage3 = { workspace = true }
postgrest = { workspace = true }
supabase = { workspace = true }

[dependency-groups]
# For `make api-docs`: griffe dumps the API as JSON, which @supabase/doc-generator reads. It is
# kept below 3 because a major version may change that JSON.
api-docs = ["griffe >=2.4.1,<3.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # isort
  "I",
  # missing argument and return type annotations
  "ANN001",
  "ANN2",
  # pylint errors and warnings
  "PLE",
  "PLW",
  # flake8-pie
  "PIE",
  # flake8-logging
  "LOG",
  # flynt
  "FLY",
  # flake8-2020
  "YTT",
  # flake8-async
  "ASYNC",
  # flake8-comprehensions
  "C4",
  # flake8-raise
  "RSE",
  # flake8-simplify
  "SIM",
  # flake8-return
  "RET",
  # flake8-pyi
  "PYI",
  # flake8-pytest-style
  "PT",
  # flake8-type-checking
  "TC",
  # Perflint
  "PERF",
  # Ruff-specific rules
  "RUF",
  # flake8-logging-format
  "G",
  # flake8-datetimez
  "DTZ",
  # flake8-print
  "T20",
  # flake8-fixme
  "FIX",
  # pydocstyle: the sections of a Google style docstring, see CONTRIBUTING.md.
  "D214",  # a section is not indented more than the docstring
  "D405",  # a section name is capitalized: `Args:`, not `args:`
  "D410",  # a blank line follows each section
  "D411",  # a blank line comes before each section, or griffe reads it as text
  "D412",  # no blank line between a section name and its content
  "D414",  # a section is not empty
  "D416",  # a section name ends with a colon: `Returns:`, not `Returns`
  "D417",  # `Args:` describes every parameter, once a docstring has that section
]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
".github/scripts/*" = ["T20"]
"src/*/scripts/*" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
# Checks that each docstring matches the signature of its function. ruff and
# .github/scripts/check_docstrings.py check the style.
style = "google"
# The types come from the annotations, not from the docstring.
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# A constructor is documented in `__init__`, where the doc generator reads it.
allow-init-docstring = true
# A field is described in the string below it. The doc generator does not read
# an `Attributes:` section.
check-class-attributes = false
# Reports a NumPy or Sphinx docstring.
check-style-mismatch = true
# pydoclint sees only the `raise` statements in the body of a function, but a
# docstring also lists the errors that the functions it calls raise.
skip-checking-raises = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["dataclasses.dataclass", "pydantic.dataclasses.dataclass"]
